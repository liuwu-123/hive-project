services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  hive-metastore:
    image: apache/hive:4.0.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
    ports:
      - "9083:9083"

  hive-server:
    image: apache/hive:4.0.0
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      # 把 HiveServer2 的 pid 文件放到 tmpfs 上：容器每次启动该目录都是空的，
      # 彻底避免"重启后 pid 文件残留、HiveServer2 误判已在运行而退出(Exited 1)"
      HIVESERVER2_PID_DIR: /tmp/hive-pid
    tmpfs:
      - /tmp/hive-pid
    ports:
      - "10000:10000"
      - "10002:10002"

  # ---------- 第 4 周新增：可视化与 BI ----------
  superset:
    build: ./superset
    container_name: hive-project-superset-1
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-dev-secret-key-change-me}
      SUPERSET_DB_URI: mysql+pymysql://root:root@mysql:3306/superset?charset=utf8mb4
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ECharts 数据大屏：Flask 提供 JSON 接口 + 静态页面
  web:
    build: ./web
    container_name: hive-project-web-1
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ydsh_ads
      TZ: Asia/Shanghai
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/api/kpi')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  # Streamlit 问答应用：NL2SQL 闭环
  # 通过挂载 docker.sock 复用宿主 docker exec 调用 beeline（见 README 说明）
  app:
    build: ./app
    container_name: hive-project-app-1
    depends_on:
      - hive-server
      - web
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
    volumes:
      - ./:/repo:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8501/healthz')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
